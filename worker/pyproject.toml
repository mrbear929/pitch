[project]
name = "pitch-worker"
version = "0.1.0"
description = "Pitch worker: pulls jobs from dispatcher, processes locally on Mac"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "yt-dlp>=2025.1.15",
  "jinja2>=3.1",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
pitch-worker = "worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
